name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configured-deps:
    name: configured-deps (8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PhpRedis
        uses: actions/checkout@v4

      - name: Install liblzf
        run: |
          git clone --depth=1 https://github.com/nemequ/liblzf.git
          cd liblzf
          autoreconf -vi
          CFLAGS=-fPIC ./configure --prefix="$GITHUB_WORKSPACE/liblzf"
          make install

      - name: Install liblz4
        run: |
          git clone -b v1.9.4 --depth=1 https://github.com/lz4/lz4
          cd lz4/lib
          PREFIX="$GITHUB_WORKSPACE/liblz4" make install

      - name: Install libzstd
        run: |
          git clone -b v1.5.5 --depth=1 https://github.com/facebook/zstd
          cd zstd
          PREFIX="$GITHUB_WORKSPACE/libzstd" make install

      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, igbinary, msgpack, :redis
          coverage: none
          tools: none

      - name: Configure and build PhpRedis with distinct dep paths
        run: |
          phpize
          ./configure \
            --enable-redis-lz4 \
            --with-liblz4="$GITHUB_WORKSPACE/liblz4" \
            --enable-redis-lzf \
            --with-liblzf="$GITHUB_WORKSPACE/liblzf" \
            --enable-redis-zstd \
            --with-libzstd="$GITHUB_WORKSPACE/libzstd"
          make -j"$(nproc)"

      - name: Check custom library paths
        run: |
          for lib in lzf lz4 zstd; do
            grep "INCLUDES.*$GITHUB_WORKSPACE/lib$lib" Makefile
            grep "REDIS_SHARED_LIBADD.*-L$GITHUB_WORKSPACE/lib$lib" Makefile
          done

      - name: Load extension with custom libraries
        run: php -n -dextension="$PWD/.libs/redis.so" --ri redis

  ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VALKEY_VERSION: '8.1.3'
      TEST_PHP_ARGS: -e
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        server: ['redis', 'dragonfly', 'valkey']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check test orchestration
        run: python3 .github/scripts/test-runner.py
      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, igbinary, msgpack, :redis
          coverage: none
          tools: none
      - name: Install system dependencies
        run: |
          sudo apt-get update --allow-releaseinfo-change-label
          sudo apt-get install -y --no-install-recommends valgrind libzstd-dev liblz4-dev libssl-dev

      - name: Install Redis
        if: matrix.server == 'redis'
        env:
          REDIS_PPA_URI: "packages.redis.io/deb"
          REDIS_PPA_KEY: "packages.redis.io/gpg"
        run: |
          curl -fsSL "https://$REDIS_PPA_KEY" | \
            sudo gpg --dearmor -o /usr/share/keyrings/redis.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis.gpg] https://$REDIS_PPA_URI $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update --allow-releaseinfo-change-label
          sudo apt-get install -y --no-install-recommends redis

      - name: Install Dragonfly
        if: matrix.server == 'dragonfly'
        run: |
          sudo curl -Lo /usr/share/keyrings/dragonfly-keyring.public \
            https://packages.dragonflydb.io/pgp-key.public
          sudo curl -Lo /etc/apt/sources.list.d/dragonfly.sources \
            https://packages.dragonflydb.io/dragonfly.sources
          sudo apt-get update --allow-releaseinfo-change-label
          sudo apt-get install dragonfly redis-server redis-tools

      - name: Cache Valkey
        if: matrix.server == 'valkey'
        id: valkey-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/valkey
          key: valkey-ubuntu-22.04-${{ runner.arch }}-${{ env.VALKEY_VERSION }}-tls-v1

      - name: Build Valkey
        if: matrix.server == 'valkey' && steps.valkey-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VALKEY_VERSION" https://github.com/valkey-io/valkey.git "$RUNNER_TEMP/valkey-src"
          make -C "$RUNNER_TEMP/valkey-src" -j"$(nproc)" BUILD_TLS=yes PREFIX="$RUNNER_TEMP/valkey" install

      - name: Add Valkey to PATH
        if: matrix.server == 'valkey'
        run: echo "$RUNNER_TEMP/valkey/bin" >> "$GITHUB_PATH"

      - name: Build phpredis
        run: |
          phpize
          ./configure \
            --enable-redis-lzf \
            --enable-redis-zstd \
            --enable-redis-igbinary \
            --enable-redis-msgpack \
            --enable-redis-lz4 \
            --with-liblz4
          make -j"$(nproc)"
          sudo make install
          echo 'extension = redis.so' | sudo tee "$(php-config --ini-dir)"/90-redis.ini

      - name: Attempt to shutdown default server
        run: |
          if [ "${{ matrix.server }}" = dragonfly ]; then
            sudo systemctl stop dragonfly redis-server || true
          else
            ${{ matrix.server }}-cli SHUTDOWN NOSAVE || true
          fi

      - name: Start standalone, TLS, cluster and Sentinel servers
        id: servers
        run: bash .github/scripts/start-servers.sh "${{ matrix.server }}"

      - name: Run tests
        run: bash .github/scripts/run-tests.sh php

      # Keep collecting memory diagnostics even if a regular suite failed.
      - name: Run tests using valgrind
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        continue-on-error: true
        run: |
          bash .github/scripts/run-tests.sh valgrind \
            --suppressions=tests/vg.supp --error-exitcode=1 php
        env:
          USE_ZEND_ALLOC: 0

      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-php-${{ matrix.php }}-${{ matrix.server }}
          path: |
            config.log
            ${{ runner.temp }}/phpredis-tests/**/*.log
            ${{ runner.temp }}/phpredis-servers/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  unstable:
    name: ${{ matrix.server }} unstable (PHP 8.5, allowed to fail)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: redis
            repository: redis/redis
          - server: valkey
            repository: valkey-io/valkey
    env:
      TEST_PHP_ARGS: -e
      PHPREDIS_TEST_SUITES: Redis RedisCluster
    steps:
      - name: Checkout PhpRedis
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check test orchestration
        run: python3 .github/scripts/test-runner.py

      - name: Install PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, igbinary, msgpack, :redis
          coverage: none
          tools: none

      - name: Install system dependencies
        run: |
          sudo apt-get update --allow-releaseinfo-change-label
          sudo apt-get install -y --no-install-recommends libzstd-dev liblz4-dev libssl-dev

      - name: Checkout ${{ matrix.server }} unstable
        id: server-source
        run: |
          git clone --depth 1 --branch unstable "https://github.com/${{ matrix.repository }}.git" "$RUNNER_TEMP/${{ matrix.server }}-src"
          sha=$(git -C "$RUNNER_TEMP/${{ matrix.server }}-src" rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.server }} unstable commit: $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache ${{ matrix.server }} unstable
        id: server-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ matrix.server }}-unstable
          key: ${{ matrix.server }}-unstable-ubuntu-22.04-${{ runner.arch }}-${{ steps.server-source.outputs.sha }}-tls-v1

      - name: Build ${{ matrix.server }} unstable
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: make -C "$RUNNER_TEMP/${{ matrix.server }}-src" -j"$(nproc)" BUILD_TLS=yes PREFIX="$RUNNER_TEMP/${{ matrix.server }}-unstable" install

      - name: Add ${{ matrix.server }} unstable to PATH
        run: echo "$RUNNER_TEMP/${{ matrix.server }}-unstable/bin" >> "$GITHUB_PATH"

      - name: Build phpredis
        run: |
          phpize
          ./configure \
            --enable-redis-lzf \
            --enable-redis-zstd \
            --enable-redis-igbinary \
            --enable-redis-msgpack \
            --enable-redis-lz4 \
            --with-liblz4
          make -j"$(nproc)"
          sudo make install
          echo 'extension = redis.so' | sudo tee "$(php-config --ini-dir)"/90-redis.ini

      - name: Attempt to shutdown default server
        run: ${{ matrix.server }}-cli SHUTDOWN NOSAVE || true

      - name: Start test servers
        run: |
          ${{ matrix.server }}-server --version | tee -a "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/start-servers.sh "${{ matrix.server }}"

      - name: Run Redis and RedisCluster tests
        run: bash .github/scripts/run-tests.sh php

      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.server }}-unstable-php-8.5
          path: |
            config.log
            ${{ runner.temp }}/phpredis-tests/**/*.log
            ${{ runner.temp }}/phpredis-servers/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      # PIE requires PHP >= 8.1, including when targeting PHP 7.4 or 8.0.
      - name: Install PHP runtime for PIE
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: pie
      - name: Save PIE runtime paths
        id: pie
        run: |
          php -r 'echo "php=", realpath(PHP_BINARY), "\n";' >> "$GITHUB_OUTPUT"
          echo "path=$(command -v pie)" >> "$GITHUB_OUTPUT"
      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, :redis
          coverage: none
          tools: none
      - name: Install dependencies
        run: |
          # Igbinary currently only publishes an RC release on Packagist.
          "${{ steps.pie.outputs.php }}" "${{ steps.pie.outputs.path }}" install --no-interaction \
            --with-php-config="$(command -v php-config)" --with-phpize-path="$(command -v phpize)" \
            'igbinary/igbinary:^3.2@RC'
          "${{ steps.pie.outputs.php }}" "${{ steps.pie.outputs.path }}" install --no-interaction \
            --with-php-config="$(command -v php-config)" --with-phpize-path="$(command -v phpize)" \
            msgpack/msgpack-php
      - name: Build phpredis
        run: |
          phpize
          ./configure --enable-redis-lzf --enable-redis-zstd --enable-redis-igbinary --enable-redis-msgpack --enable-redis-lz4 --with-liblz4
          make -j"$(sysctl -n hw.logicalcpu)"
          sudo make install
          sudo mkdir -p "$(php-config --ini-dir)"
          echo 'extension = redis.so' | sudo tee "$(php-config --ini-dir)/90-redis.ini"
          php --ri redis

  pecl:
    runs-on: ubuntu-latest
    container: php:8.3-cli-alpine
    timeout-minutes: 20
    steps:
      - name: Install required system packages
        run: apk add --no-cache $PHPIZE_DEPS zstd-libs zstd-dev git
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Create temporary directory
        id: temp-dir
        run: printf "path=%s\n" "$(mktemp -d)" >>"$GITHUB_OUTPUT"
      - name: Create package
        run: |
          cd "${{ steps.temp-dir.outputs.path }}"
          pecl package "$GITHUB_WORKSPACE/package.xml"
      - name: Compile package
        run: printf '' | pecl install ${{ steps.temp-dir.outputs.path }}/redis-*.tgz
      - name: Enable extension
        run: docker-php-ext-enable redis
      - name: Check for PHP startup warnings
        run: |
          php -d display_errors=stderr -d display_startup_errors=1 -d error_reporting=-1 -r ';' 2>/tmp/php-startup-warnings
          if [ -s /tmp/php-startup-warnings ]; then
            echo 'The PHP extension was successfully installed, but PHP raised these warnings:' >&2
            cat /tmp/php-startup-warnings >&2
            exit 1
          fi
          echo "PHP didn't raise any warnings at startup."
      - name: Inspect extension
        run: php --ri redis
